<div class="reports-container">
  <div class="reports-header">
    <h1>Reports</h1>
    <p>Generate and manage your enterprise reports</p>
  </div>

  <div class="reports-content">
    <div class="reports-stats">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
        <h3>Total Reports</h3>
        <p class="stat-value">{{ reportsData.totalReports }}</p>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
        <h3>This Month</h3>
        <p class="stat-value">{{ reportsData.generatedThisMonth }}</p>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
        <h3>Pending</h3>
        <p class="stat-value">{{ reportsData.pendingReports }}</p>
      </div>
    </div>

    <div class="reports-placeholder">
      <h2><i class="fas fa-chart-pie"></i> Reports Dashboard</h2>
      <div *ngIf="!chartData">
        <p>Report generation and management interface will be implemented here.</p>
      </div>
      <div *ngIf="chartData">
        <canvas baseChart
                [data]="{ labels: chartLabels, datasets: chartDatasets }"
                [options]="chartOptions"
                [type]="'bar'">
        </canvas>
      </div>
    </div>
  </div>
</div>
